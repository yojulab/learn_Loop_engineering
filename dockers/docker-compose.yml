# Loop Engineering 실습 환경: Langfuse(관측) + PostgreSQL + LiteLLM Proxy + 앱 컨테이너(Claude CLI · Python)
#  - Langfuse 웹 UI(${LANGFUSE_PORT:-30000}:3000)와 LiteLLM Proxy(${LITELLM_PORT:-4000}:4000) 포트를 게시하며, app·db_postgres 포트는 비공개입니다.
#  - 컨테이너 간 통신은 내부 네트워크, 앱 접속은 `docker compose exec app bash`.
#  - 볼륨 경로, 계정, 키는 모두 .env 에서 설정합니다. (cp .env.example .env)
services:
  # Langfuse 전용 PostgreSQL (Langfuse v2 는 PostgreSQL 만 필요)
  db_postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-16}
    container_name: ${PROJECT_NAME:-learn_loop_engineering}_db_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${LANGFUSE_DB_NAME:-db_langfuse}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Seoul}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Langfuse LLM 관측 · 프롬프트 관리 플랫폼
  langfuse:
    image: docker.io/langfuse/langfuse:${LANGFUSE_IMAGE_TAG:-2}
    container_name: ${PROJECT_NAME:-learn_loop_engineering}_langfuse
    ports:
      - "${LANGFUSE_PORT:-30000}:3000"
    depends_on:
      db_postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@db_postgres:5432/${LANGFUSE_DB_NAME:-db_langfuse}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?.env 에 LANGFUSE_NEXTAUTH_SECRET 설정 필요 (cp .env.example .env)}
      SALT: ${LANGFUSE_SALT:?.env 에 LANGFUSE_SALT 설정 필요 (cp .env.example .env)}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:30000}
      TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:-false}
      # 최초 구동 시 조직 · 프로젝트 · 관리자 · API Key 자동 생성 (Headless Initialization)
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-loop-org}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Loop Engineering Org}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-loop-project}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-Loop Engineering}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-loop-engineering-public}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-loop-engineering-secret}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@example.com}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-admin123456}

  # LiteLLM Multi-Platform Zero-Code Proxy (Claude · ChatGPT · Gemini · Ollama -> Langfuse)
  litellm-proxy:
    image: docker.litellm.ai/berriai/litellm:${LITELLM_IMAGE_TAG:-main-latest}
    container_name: ${PROJECT_NAME:-learn_loop_engineering}_litellm_proxy
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ./langfuse_v2_callback.py:/app/langfuse_v2_callback.py:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    depends_on:
      - langfuse
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-local}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-loop-engineering-public}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-loop-engineering-secret}
      PYTHONPATH: /app
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}

  # 실습 앱 컨테이너: Python 3.13 + Claude Code CLI + Antigravity CLI + langfuse SDK
  #  - 이미지 빌드 시 /apps/learn_Loop_engineering 에 저장소를 git clone 하며,
  #    기동 시 entrypoint.sh 가 로컬 볼륨(/apps)에 소스를 동기화하고 Langfuse 준비 후 ch11 seed_prompts.py 및 seed_langfuse_dashboard.py 를 자동 실행합니다.
  #    런타임 volumes 는 호스트 폴더를 /apps 에 마운트해 추후 /apps/* 프로젝트 폴더 추가를 지원합니다.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-learn_loop_engineering}_app
    working_dir: /apps/learn_Loop_engineering
    env_file:
      - .env
    volumes:
      - ${APP_PROJECTS_DIR:-./apps}:/apps
      - ./volumes/gemini:/root/.gemini
    depends_on:
      - langfuse
      - litellm-proxy
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
