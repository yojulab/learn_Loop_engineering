# LiteLLM Multi-Platform Zero-Code Proxy 설정 (Gemini CLI · Claude CLI · API · Ollama)
model_list:
  - model_name: gemini-cli
    litellm_params:
      model: openai/gemini-cli
      api_base: os.environ/GEMINI_BRIDGE_BASE_URL
      api_key: dummy-gemini-key
  - model_name: claude-cli
    litellm_params:
      model: openai/claude-cli
      api_base: os.environ/CLAUDE_BRIDGE_BASE_URL
      api_key: dummy-claude-key
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: local-ollama
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://host.docker.internal:11434

litellm_settings:
  callbacks: langfuse_v2_callback.proxy_handler_instance
