services:
  litellm-proxy:
    image: docker.litellm.ai/berriai/litellm:main-latest
    container_name: learn_loop_litellm_proxy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ./langfuse_v2_callback.py:/app/langfuse_v2_callback.py:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-local}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-loop-engineering-public}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-loop-engineering-secret}
      - PYTHONPATH=/app
      - GEMINI_BRIDGE_BASE_URL=${GEMINI_BRIDGE_BASE_URL:-http://host.docker.internal:4010/v1}
      - CLAUDE_BRIDGE_BASE_URL=${CLAUDE_BRIDGE_BASE_URL:-http://host.docker.internal:4011/v1}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://host.docker.internal:30000}
